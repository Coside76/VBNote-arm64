name: Sync Upstream

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  # Allows you to manually trigger a sync via the Actions tab anytime
  workflow_dispatch:

# Explicitly grant the bot write access to push to the repository
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with Upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add upstream remote and fetch changes
          git remote add upstream https://github.com/highenergymagic/VBNote.git
          git fetch upstream
          
          # Switch to main and merge upstream/main
          git checkout main
          git merge upstream/main --no-edit || git merge --abort
          
          # Push updated code back to your fork
          git push origin main
